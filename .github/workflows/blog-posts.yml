name: Latest blog posts

# Refreshes the "Latest from the blog" list in profile/README.md from the
# site's RSS feed.
on:
  schedule:
    # Mondays at 13:00 UTC, early morning in Montgomery.
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.mmintelligence.ai/feed.xml"
          readme_path: "./profile/README.md"
          max_post_count: 5
          commit_message: "Update latest blog posts"
          committer_username: "github-actions[bot]"
          committer_email: "41898282+github-actions[bot]@users.noreply.github.com"
